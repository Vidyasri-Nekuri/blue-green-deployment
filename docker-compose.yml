version: '3'

services:

  blue:
    image: nginx:latest
    container_name: blue-app
    volumes:
      - ./blue:/usr/share/nginx/html
    networks:
      - app-network

  green:
    image: nginx:latest
    container_name: green-app
    volumes:
      - ./green:/usr/share/nginx/html
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - blue
      - green
    networks:
      - app-network

networks:
  app-network:
